name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-ci-build
  SUPABASE_JWT_SECRET: placeholder-supabase-jwt-secret-for-ci-build-min-32-chars
  AUTH_COOKIE_SECRET: placeholder-auth-cookie-secret-for-ci-build-min-32-chars
  WIDGET_EMBED_SECRET: placeholder-widget-embed-secret-for-ci-build-min-32-chars
  RATE_LIMIT_SECRET: placeholder-rate-limit-secret-for-ci-build-min-32-chars

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @site-chat/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test shared package
        run: pnpm --filter @site-chat/shared test

      - name: Test web auth utilities
        run: pnpm --filter @site-chat/web test

      - name: Test widget package
        run: pnpm --filter @site-chat/widget test

      - name: Format check
        run: pnpm format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @site-chat/shared build

      - name: Build widget bundle
        run: pnpm --filter @site-chat/widget build

      - name: Verify widget bundles contain no machine-specific paths
        run: pnpm --filter @site-chat/widget verify:bundle-paths

      - name: Verify committed widget bundles match build output
        run: git diff --exit-code apps/web/public/widget/

      - name: Build web app
        run: pnpm --filter @site-chat/web build

      - name: Check service role key not in client bundle
        run: |
          if grep -r "placeholder-service-role-key-for-ci-build" apps/web/.next/static/ 2>/dev/null; then
            echo "ERROR: Service role key found in client bundle!"
            exit 1
          fi
          echo "Client bundle check passed"

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset database
        run: supabase db reset

      - name: Run database tests
        run: supabase test db

      - name: Check generated database types
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u packages/shared/src/database.types.ts /tmp/database.types.ts

  e2e-realtime:
    name: Playwright Realtime E2E
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset database and seed
        run: supabase db reset

      - name: Build application
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright cross-origin realtime suite
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHQiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4tI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          AUTH_COOKIE_SECRET: placeholder-auth-cookie-secret-for-ci-build-min-32-chars
          WIDGET_EMBED_SECRET: placeholder-widget-embed-secret-for-ci-build-min-32-chars
          RATE_LIMIT_SECRET: placeholder-rate-limit-secret-for-ci-build-min-32-chars
          NEXT_PUBLIC_APP_URL: http://localhost:3000
