name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-ci-build

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @site-chat/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @site-chat/shared build

      - name: Build web app
        run: pnpm --filter @site-chat/web build

      - name: Check service role key not in client bundle
        run: |
          if grep -r "placeholder-service-role-key-for-ci-build" apps/web/.next/static/ 2>/dev/null; then
            echo "ERROR: Service role key found in client bundle!"
            exit 1
          fi
          echo "Client bundle check passed"

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Supabase CLI
        run: |
          curl -fsSL -o supabase.deb "https://github.com/supabase/cli/releases/download/v2.20.5/supabase_2.20.5_linux_amd64.deb"
          sudo dpkg -i supabase.deb

      - name: Install PostgreSQL client and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client postgresql-16 postgresql-16-pgtap
          sudo pg_ctlcluster 16 main start

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset database and run tests
        run: pnpm db:test

      - name: Generate and check database types
        run: |
          pnpm gen:types
          pnpm db:types:check
