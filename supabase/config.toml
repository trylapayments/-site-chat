# Site Chat local Supabase configuration.

project_id = "site-chat"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed_demo.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/recovery",
]
jwt_expiry = 3600
enable_signup = true

[auth.sessions]
# Maximum session lifetime (7 days). Enforced on next refresh.
timebox = "168h"
# Invalidate sessions inactive longer than 24 hours. Enforced on next refresh.
inactivity_timeout = "24h"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
